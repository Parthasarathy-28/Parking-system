# Render.com Blueprint Infrastructure Specification for ParkPulse 2.0
# Deploys:
# 1. Managed PostgreSQL Database
# 2. Node.js Backend Web Service (Express + Socket.IO + Hold Sweeper)
# 3. Static Frontend Web Service (Vite + React PWA)

databases:
  - name: parkpulse-postgres
    databaseName: parkpulse
    user: parkpulse_admin
    plan: free # or starter
    region: oregon # or frankfurt/singapore
    ipAllowList: [] # allow all connections with valid credentials

services:
  # Backend API + WebSocket Server
  - type: web
    name: parkpulse-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: parkpulse-client
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: parkpulse-postgres
          property: connectionString

  # Frontend PWA Client
  - type: web
    name: parkpulse-client
    env: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: parkpulse-api
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: parkpulse-api
          property: host
